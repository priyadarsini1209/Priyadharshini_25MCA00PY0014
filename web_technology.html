<!DOCTYPE html>
<html>
<head>

<title>Web Technology</title>

<style>

body{
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#bbd3f3,#f7d5f4);
    text-align:center;
    padding-top:50px;
}


/* Remove bullet */

ul{
    list-style:none;
    padding:0;
}


/* Link Style */

.web-link{

    display:inline-block;

    padding:15px 35px;

    margin:15px;

    background:linear-gradient(135deg,#fd8434,#e7cb71c0);

    color:rgb(8, 2, 2);

    text-decoration:none;

    font-size:20px;

    font-weight:bold;

    border-radius:40px;

    letter-spacing:1px;

    box-shadow:0 10px 20px rgba(102,126,234,0.4);

    transition:0.4s;

}



/* Hover Effect */

.web-link:hover{

    background:linear-gradient(135deg,#88f372,#c892f5);

    transform:translateY(-8px) scale(1.05);

    box-shadow:0 15px 30px rgba(74, 182, 64, 0.5);

}



/* Back Button */

.back{

    display:inline-block;

    margin-top:30px;

    padding:12px 25px;

    background:#243b55;

    color:rgb(252, 154, 154);

    border-radius:25px;

    text-decoration:none;

}


.back:hover{

    background:#5f074c;

}


</style>

</head>


<body>


<h1>Web Technology Projects</h1>


<ul>

<li>
<a href="resume.html" class="web-link">
📄 Resume
</a>
</li>


<li>
<a href="online_shopping.html" class="web-link">
🛒 Online Shopping
</a>
</li>

<li>
<a href="quiz.html" class="web-link">
❓ quiz quest
</a>
</li>


</ul>



<a href="portfolio.html" class="back">
← Back to Portfolio
</a>


</body>

</html>
