<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Quiz</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f2f2f2;
}

.container{
    width:600px;
    margin:40px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}

h1{
    text-align:center;
    color:#2874f0;
}

#question{
    font-size:22px;
    margin:20px 0;
}

.option{
    display:block;
    width:100%;
    margin:10px 0;
    padding:12px;
    font-size:18px;
    cursor:pointer;
}

button{
    padding:10px 20px;
    font-size:18px;
    background:#77a7f5;
    color:rgb(7, 7, 7);
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#174ea6;
}

#result{
    text-align:center;
    font-size:25px;
    color:green;
}
</style>
</head>

<body>

<div class="container">

<h1>Online Quiz</h1>

<div id="quiz">
<h2 id="question"></h2>

<div id="options"></div>

<br>

<button onclick="nextQuestion()">Next</button>

</div>

<div id="result"></div>

</div>

<script>

let questions=[
{
question:" ★ HTML stands for?",
options:["Hyper Text Markup Language","Home Tool Markup Language","Hyperlinks Text","High Text"],
answer:"Hyper Text Markup Language"
},
{
question:" ★ CSS is used for?",
options:["Styling","Programming","Database","Server"],
answer:"Styling"
},
{
question:" ★ JavaScript is?",
options:["Programming Language","Database","Browser","Operating System"],
answer:"Programming Language"
},
{
question:" ★ Which tag creates a paragraph?",
options:["<p>","<h1>","<div>","<br>"],
answer:"<p>"
},
{
question:" ★ Which tag inserts image?",
options:["<img>","<image>","<pic>","<photo>"],
answer:"<img>"
},
{
question:" ★  Which symbol is used for id selector in CSS?",
options:["#",".","*","@"],
answer:"#"
},
{
question:" ★ Which symbol is used for class selector?",
options:[".","#","*","&"],
answer:"."
},
{
question:" ★ Which keyword declares variable?",
options:["let","print","new","create"],
answer:"let"
},
{
question:" ★ Which function displays alert?",
options:["alert()","show()","print()","msg()"],
answer:"alert()"
},
{
question:" ★ Which company developed JavaScript?",
options:["Netscape","Google","Apple","Microsoft"],
answer:"Netscape"
},
{
question:" ★ Which tag creates a table?",
options:["<table>","<tr>","<td>","<th>"],
answer:"<table>"
},
{
question:" ★ Which property changes text color?",
options:["color","font","background","size"],
answer:"color"
},
{
question:" ★ Which property changes background color?",
options:["background","color","font","border"],
answer:"background"
},
{
question:" ★ Which method writes to console?",
options:["console.log()","print()","echo()","write()"],
answer:"console.log()"
},
{
question:" ★ Which loop repeats code?",
options:["for","size","font","body"],
answer:"for"
},
{
question:" ★ Which keyword defines function?",
options:["function","method","define","fun"],
answer:"function"
},
{
question:" ★ HTML file extension?",
options:[".html",".css",".js",".java"],
answer:".html"
},
{
question:" ★ CSS file extension?",
options:[".css",".html",".js",".xml"],
answer:".css"
},
{
question:" ★ JavaScript file extension?",
options:[".js",".css",".html",".php"],
answer:".js"
},
{
question:" ★ Which event occurs on button click?",
options:["onclick","onhover","onload","onmove"],
answer:"onclick"
}
];

function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        let j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
}

shuffle(questions);

questions.forEach(q=>shuffle(q.options));

let current=0;
let score=0;
let selected="";

loadQuestion();

function loadQuestion(){

    selected = "";

    document.getElementById("question").textContent =
        questions[current].question;

    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    questions[current].options.forEach(option => {

        const btn = document.createElement("button");
        btn.className = "option";
        btn.textContent = option;   // Shows <p>, <img>, etc. as text

        btn.onclick = function () {
            selectAnswer(btn, option);
        };

        optionsDiv.appendChild(btn);
    });
}


function selectAnswer(btn,answer){

selected=answer;

document.querySelectorAll(".option").forEach(b=>{
b.style.background="";
b.style.color="black";
});

btn.style.background="#2874f0";
btn.style.color="white";

}

function nextQuestion(){

if(selected==""){
alert("Please select an answer");
return;
}

if(selected==questions[current].answer){
score++;
}

current++;

if(current<questions.length){
loadQuestion();
}
else{

document.getElementById("quiz").style.display="none";

document.getElementById("result").innerHTML=
"<h2>Your Score: "+score+" / "+questions.length+
"</h2><br><button onclick='location.reload()'>Restart Quiz</button>";

}

}

</script>
<a href="portfolio.html">← Back to Portfolio</a>

</body>
</html>
