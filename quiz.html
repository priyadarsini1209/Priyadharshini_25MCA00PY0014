<style>
body {

    color: #212121;
    margin: 0;
    padding: 0;
}

.container {
    width: 700px;
    margin: 40px auto;
    background: #ffffff;
    padding: 32px;

    font-weight: 500;
    margin-bottom: 8px;

}

p {

}

    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

    font-size: 16px;
    font-weight: 500;
    color: #b00020;
    background: #fdecea;
    padding: 8px 16px;
    border-radius: 6px;
}

.palette-container {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
    justify-content: center;
}

.palette-btn {
    width: 35px;
    height: 35px;
    border-radius: 50%;
    border: 1px solid #ccc;
    background: #f1f3f4;
    color: #3c4043;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
}

.palette-btn.current {
    border: 2px solid #6200ee;
}

.palette-btn.answered {
    background: #018786;
    color: white;
    border: none;
}

#question {
    text-align: left;
    font-size: 20px;
    font-weight: 500;
    color: #212121;
    margin: 16px 0 24px 0;
}

.option {
    display: block;
    width: 100%;
    margin: 12px 0;
    padding: 14px 16px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    background: #f1f3f4;
    color: #3c4043;
    border: none;
    border-radius: 8px;
    text-align: left;
    transition: background 0.2s, box-shadow 0.2s;
    box-sizing: border-box;
}

.option:hover {
    background: #e8eaed;
}

.nav-buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 24px;
}

button {
    padding: 12px 24px;
    font-size: 16px;
    font-weight: 500;
    background: #6200ee;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    transition: background 0.2s, box-shadow 0.2s;
}

button:hover {
    background: #3700b3;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
}

button:disabled {
    background: #e0e0e0;
    color: #9e9e9e;
    cursor: not-allowed;
    box-shadow: none;
}

.secondary-btn {
    background: #757575;
}

.secondary-btn:hover {
    background: #616161;
}

#result {
    font-size: 24px;
    font-weight: 500;
    color: #018786;
    text-align: center;
}
</style>
</head>

<body>

<div class="container">

<div id="startPage" style="text-align: center;">
<h1>Online Quiz</h1>
<p>Test your knowledge with 20 randomized questions! You have 10 minutes total for the entire quiz. You can freely navigate between questions using the question palette.</p>
<br>
<button onclick="startQuiz()">Start Quiz</button>
</div>

<div id="quiz" style="display:none;">
<div class="quiz-header">
    <div id="questionIndicator" style="font-weight: 500; color: #6200ee;">Question 1 of 20</div>

</div>

<div class="palette-container" id="paletteContainer"></div>

<h2 id="question"></h2>
<div id="options"></div>

<div class="nav-buttons">
    <button id="prevBtn" class="secondary-btn" onclick="prevQuestion()">Previous</button>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>
</div>
</div>

<div id="result"></div>

</div>

let quizQuestions = [];
let current = 0;
let userAnswers = {}; // Stores index of chosen answer for each question
let globalTimer = null;
let totalTimeLeft = 600; // 10 minutes in seconds

function startQuiz() {
    document.getElementById("startPage").style.display = "none";
    document.getElementById("quiz").style.display = "block";

    quizQuestions = getRandomQuestions(questions, 20);
    userAnswers = {};
    current = 0;

    createPalette();
    loadQuestion();
    startGlobalTimer();
}

function getRandomQuestions(arr, count) {
    let shuffled = [...arr];
    for (let i = shuffled.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    
    let selectedSet = shuffled.slice(0, count);
    selectedSet.forEach(q => {
        q.shuffledOptions = [...q.options];
        for(let i = q.shuffledOptions.length - 1; i > 0; i--){
            let j = Math.floor(Math.random() * (i + 1));
            [q.shuffledOptions[i], q.shuffledOptions[j]] = [q.shuffledOptions[j], q.shuffledOptions[i]];
        }
    });

    return selectedSet;
}

function startGlobalTimer() {
    clearInterval(globalTimer);
    totalTimeLeft = 600;
    updateTimerDisplay();

    globalTimer = setInterval(() => {
        totalTimeLeft--;
        updateTimerDisplay();
        if(totalTimeLeft <= 0) {
            clearInterval(globalTimer);
            submitQuiz();
        }
    }, 1000);
}

function updateTimerDisplay() {
    let minutes = Math.floor(totalTimeLeft / 60);
    let seconds = totalTimeLeft % 60;
    document.getElementById("timerDisplay").innerText = `Time Left: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
}

function createPalette() {
    let container = document.getElementById("paletteContainer");
    container.innerHTML = "";
    quizQuestions.forEach((q, index) => {
        let btn = document.createElement("button");
        btn.className = "palette-btn";
        btn.id = `palette-${index}`;
        btn.innerText = index + 1;
        btn.onclick = () => goToQuestion(index);
        container.appendChild(btn);
    });
}

function updatePalette() {
    quizQuestions.forEach((q, index) => {
        let btn = document.getElementById(`palette-${index}`);
        btn.classList.remove("current", "answered");
        
        if(index === current) {
            btn.classList.add("current");
        }
        if(userAnswers[index] !== undefined) {
            btn.classList.add("answered");
        }
    });
}

function loadQuestion() {
    document.getElementById("questionIndicator").innerText = `Question ${current + 1} of ${quizQuestions.length}`;
    document.getElementById("question").innerHTML = `${quizQuestions[current].question}`;

    let options = document.getElementById("options");
    options.innerHTML = "";

    quizQuestions[current].shuffledOptions.forEach((option, optionIndex) => {
        let btn = document.createElement("button");
        btn.className = "option";
        btn.innerHTML = option;

        // Highlight if already selected by user
        if(userAnswers[current] === option) {
            btn.style.background = "#6200ee";
            btn.style.color = "white";
        }

        btn.onclick = function(){
            selectAnswer(btn, option);
        };

        options.appendChild(btn);
    });

    // Button states
    document.getElementById("prevBtn").disabled = (current === 0);
    let nextBtn = document.getElementById("nextBtn");
    if(current === quizQuestions.length - 1) {
        nextBtn.innerText = "Submit Quiz";
    } else {
        nextBtn.innerText = "Next";
    }

    updatePalette();
}

function selectAnswer(btn, answer){
    userAnswers[current] = answer;
    
    // Refresh option styles
    let buttons = document.querySelectorAll(".option");
    buttons.forEach(b => {
        b.style.background = "#f1f3f4";
        b.style.color = "#3c4043";
    });
    btn.style.background = "#6200ee";
    btn.style.color = "white";

    updatePalette();
}

function goToQuestion(index) {
    current = index;
    loadQuestion();
}

function prevQuestion() {
    if(current > 0) {
        current--;
        loadQuestion();
    }
}

function nextQuestion() {
    if(current < quizQuestions.length - 1) {
        current++;
        loadQuestion();
    } else {
        submitQuiz();
    }
}

function submitQuiz() {
    clearInterval(globalTimer);

    let score = 0;
    quizQuestions.forEach((q, index) => {
        if(userAnswers[index] === q.answer) {
            score++;
        }
    });

    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").innerHTML = `
        <h2>Quiz Completed!</h2>
        <p>Your Score: ${score} / ${quizQuestions.length}</p>
        <br>
        <button onclick="location.reload()">Restart Quiz</button>
    `;
}
</script>

</body>
</html>
