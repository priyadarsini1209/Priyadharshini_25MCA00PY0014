<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific Calculator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(135deg,#667eea,#764ba2);
}

.calculator{
    width:360px;
    background:#fff;
    padding:20px;
    border-radius:15px;
    box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

#display{
    width:100%;
    height:60px;
    font-size:25px;
    text-align:right;
    padding:10px;
    border:2px solid #ccc;
    border-radius:10px;
    margin-bottom:15px;
}

.buttons,
.scientific{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.scientific{
    margin-top:15px;
}

button{
    padding:15px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#f0f0f0;
    transition:.3s;
}

button:hover{
    background:#d9d9d9;
}

.equal{
    grid-column:span 4;
    background:#6ba579;
    color:white;
}

.equal:hover{
    background:#055215;
}

.hidden{
    display:none;
}
</style>

</head>
<body>

<div class="calculator">
<div class="top">
    <h2>Calculator</h2>
    <button id="toggleBtn" onclick="toggleScientific()">Scientific</button>
</div>

    <input type="text" id="display" readonly>

    <div class="buttons">
        <button onclick="clearDisplay()">C</button>
        <button onclick="backspace()">⌫</button>
        <button onclick="append('%')">%</button>
        <button onclick="append('/')">÷</button>

        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button onclick="append('*')">×</button>

        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button onclick="append('-')">−</button>

        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>
        <button onclick="append('+')">+</button>

        <button onclick="append('0')">0</button>
        <button onclick="append('.')">.</button>
        <button onclick="append('(')">(</button>
        <button onclick="append(')')">)</button>

        <button class="equal" onclick="calculate()">=</button>
    </div>

    <div class="scientific hidden" id="scientific">
        <button onclick="func('sin(')">sin</button>
        <button onclick="func('cos(')">cos</button>
        <button onclick="func('tan(')">tan</button>
        <button onclick="func('log(')">log</button>

        <button onclick="func('ln(')">ln</button>
        <button onclick="func('sqrt(')">√</button>
        <button onclick="append('**2')">x²</button>
        <button onclick="append('**')">xʸ</button>

        <button onclick="append('PI')">π</button>
        <button onclick="append('E')">e</button>
    </div>

</div>

<script>
const display = document.getElementById("display");
const scientific = document.getElementById("scientific");
const toggleBtn = document.getElementById("toggleBtn");

function toggleScientific() {
    scientific.classList.toggle("hidden");
    if (scientific.classList.contains("hidden")) {
        toggleBtn.innerText = "Scientific";
    } else {
        toggleBtn.innerText = "Standard";
    }
}

function append(value){
    display.value += value;
}

function clearDisplay(){
    display.value = "";
}

function backspace(){
    display.value = display.value.slice(0, -1);
}

function func(value){
    display.value += value;
}

function calculate(){
    let exp = display.value;

    exp = exp.replace(/PI/g, Math.PI);
    exp = exp.replace(/E/g, Math.E);

    exp = exp.replace(/sin\((.*?)\)/g, (_,x)=>Math.sin(Number(x)*Math.PI/180));
    exp = exp.replace(/cos\((.*?)\)/g, (_,x)=>Math.cos(Number(x)*Math.PI/180));
    exp = exp.replace(/tan\((.*?)\)/g, (_,x)=>Math.tan(Number(x)*Math.PI/180));
    exp = exp.replace(/sqrt\((.*?)\)/g, (_,x)=>Math.sqrt(Number(x)));
    exp = exp.replace(/log\((.*?)\)/g, (_,x)=>Math.log10(Number(x)));
    exp = exp.replace(/ln\((.*?)\)/g, (_,x)=>Math.log(Number(x)));

    try{
        display.value = eval(exp);
    }catch{
        display.value = "Error";
    }
}
</script>

</body>
</html>
